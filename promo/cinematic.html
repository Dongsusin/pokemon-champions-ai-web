<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CHAMPIONS ARENA · Cinematic</title>
    <link rel="stylesheet" href="/promo/cinematic.css" />
  </head>
  <body>
    <main id="cinematic" class="cinematic" aria-label="포켓몬 챔피언스 아레나 프로모션 연출">
      <div class="color-wash"></div>
      <canvas class="atmosphere" aria-hidden="true"></canvas>
      <div class="trainer-roster" aria-label="전체 AI 트레이너 로스터"></div>
      <div class="pokemon-roster" aria-label="전국도감 전체 포켓몬"><canvas class="pokemon-wall" aria-label="전국도감 전체 스프라이트"></canvas></div>
      <div class="pokemon-scale-label"><span>지금 펼쳐진 파트너</span><strong>0</strong><small>POKÉMON</small></div>
      <div class="shade"></div>
      <div class="item-orbit" aria-label="실제 게임의 배틀 아이템"></div>
      <div class="item-hero"></div>
      <div class="trainer-spotlight" aria-label="트레이너 전신 스프라이트"></div>
      <div class="pokemon-spotlight" aria-label="실제 게임의 포켓몬 스프라이트"></div>
      <div class="copy copy-one"><span class="eyebrow"></span><h1></h1><p></p></div>
      <div class="copy copy-two"><span class="eyebrow"></span><h2></h2><p></p></div>
      <span class="brand">CHAMPIONS ARENA</span>
      <span class="footage-note">프로모션 연출</span>
      <span class="bottom-streak" aria-hidden="true"></span>
    </main>
    <script type="module" src="/promo/cinematic.js"></script>
  </body>
</html>
