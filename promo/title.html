<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Champions Arena · Trailer titles</title>
  <style>
    * {box-sizing:border-box}
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#050a18;color:#fff;font-family:'Malgun Gothic','Noto Sans KR',sans-serif}
    .stage {position:relative;width:1920px;height:1080px;overflow:hidden;isolation:isolate;background:#060c1e}
    .bg {position:absolute;inset:-45px;background:linear-gradient(90deg,#030817db,#03081761 50%,#030817d4),linear-gradient(0deg,#030817e8,transparent 60%),url('/assets/champions-lobby-bg.jpg') center/cover;animation:camera-push 10s cubic-bezier(.3,0,.4,1) both}
    .glow {position:absolute;inset:0;background:radial-gradient(ellipse at 50% 37%,#39bfff24,transparent 60%);pointer-events:none}
    .halo {position:absolute;left:490px;top:20px;width:940px;height:940px;border:1px solid #b4edff1c;border-radius:50%;opacity:.5;animation:halo-expand 10s ease-out both}
    .halo::after {content:'';position:absolute;inset:40px;border:1px solid #b4edff10;border-radius:50%}
    .hero {position:absolute;left:90px;right:90px;top:94px;text-align:center}
    .emblem {display:block;margin:0 auto;width:248px;height:248px;object-fit:contain;filter:drop-shadow(0 18px 30px #0009);animation:emblem-in 1.35s .05s cubic-bezier(.16,.8,.22,1) both}
    .name {margin:20px 0 0;font:900 67px/1.03 Arial,sans-serif;letter-spacing:-2px;text-shadow:0 9px 40px #0008}
    .name .title-line {display:block;overflow:hidden;padding-bottom:8px}
    .name .title-line>span {display:block;animation:title-in 1.05s .32s cubic-bezier(.16,.8,.22,1) both}
    .name .title-line:last-child {font-size:98px;letter-spacing:-4px}
    .name .title-line:last-child>span {animation-delay:.5s}
    .tagline {margin:56px 0 0;font-size:61px;line-height:1.25;font-weight:900;letter-spacing:-3px;text-shadow:0 6px 24px #000b;animation:line-in 1s .88s cubic-bezier(.16,.8,.22,1) both}
    .cta {display:flex;width:max-content;max-width:100%;align-items:center;gap:29px;margin:43px auto 0;padding:24px 39px 26px;border:1px solid #a5ecff8c;border-radius:15px;color:#071323;background:linear-gradient(120deg,#b5f6ff,#72dfff);box-shadow:0 15px 45px #0004,0 0 40px #80e4ff12;font:800 49px/1.2 Arial,sans-serif;letter-spacing:-1.3px;text-decoration:none;animation:line-in 1.05s 1.18s cubic-bezier(.16,.8,.22,1) both}
    .cta svg {width:43px;height:43px;flex:none;animation:arrow-drift 4s 2.25s ease-in-out infinite}
    .particles {position:absolute;inset:0;pointer-events:none}
    .particle {position:absolute;width:3px;height:3px;background:#cbf8ff;border-radius:50%;opacity:0;animation:particle-drift 10s linear infinite}
    .intro .bg {inset:0;background:radial-gradient(ellipse at 50% 44%,#183e5b 0,#0b1b32 42%,#040b1b 80%);animation:none}
    .intro .hero {top:167px}
    .intro .emblem {width:354px;height:354px}
    .intro .name {font-size:85px;margin-top:45px}
    .intro .name .title-line:last-child {font-size:113px;letter-spacing:-4px}
    .intro .halo,.intro .particles {display:none}
    @keyframes emblem-in {from{opacity:0;transform:translateY(22px) scale(.86)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes title-in {from{opacity:0;transform:translateY(105%)}to{opacity:1;transform:translateY(0)}}
    @keyframes line-in {from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    @keyframes camera-push {from{transform:scale(1)}to{transform:scale(1.055)}}
    @keyframes halo-expand {from{transform:scale(.96);opacity:.2}to{transform:scale(1.07);opacity:.5}}
    @keyframes arrow-drift {0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
    @keyframes particle-drift {0%{opacity:0;transform:translate(0,60px)}20%,80%{opacity:.45}100%{opacity:0;transform:translate(25px,-150px)}}
  </style>
</head>
<body>
  <main class="stage" aria-label="포켓몬 챔피언스 아레나">
    <div class="bg"></div><div class="glow"></div><div class="halo"></div><div class="particles"></div>
    <div class="hero">
      <img class="emblem" alt="Champions Arena 로고" src="/assets/brand/champions-arena-emblem.png">
      <h1 class="name"><span class="title-line"><span>POKÉMON</span></span><span class="title-line"><span>CHAMPIONS ARENA</span></span></h1>
      <p class="tagline">다음 챔피언은, 당신.</p>
      <a class="cta" href="https://pokemon-champions-area-web.co.kr"><span>pokemon-champions-area-web.co.kr</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></a>
    </div>
  </main>
  <script>
    const params=new URLSearchParams(location.search)
    const intro=params.has('intro')
    document.body.classList.add(intro?'intro':'outro')
    if(intro){document.querySelector('.tagline').remove();document.querySelector('.cta').remove()}
    else for(let i=0;i<36;i++) {
      const p=document.createElement('i');p.className='particle'
      p.style.cssText=`left:${(i*137)%1920}px;top:${(i*197)%1080}px;animation-delay:-${i*.29}s;animation-duration:${8+i%5}s`
      document.querySelector('.particles').append(p)
    }
    window.titleReady=Promise.all([document.fonts.ready,...[...document.images].map(img=>img.decode())])
    window.promoTitle={
      ready:window.titleReady,
      setTime(time){const seconds=Math.max(0,Number(time)||0);document.getAnimations().forEach(animation=>{animation.pause();animation.currentTime=seconds*1000});return seconds},
      status(){return {sceneId:intro?'intro':'outro',logoLoaded:document.querySelector('.emblem').complete&&document.querySelector('.emblem').naturalWidth>0,visibleText:document.body.innerText.trim().split(/\n+/).map(line=>line.trim()).filter(Boolean),cta:intro?null:'pokemon-champions-area-web.co.kr'}}
    }
  </script>
</body>
</html>
