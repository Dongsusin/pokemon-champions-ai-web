<!doctype html><html lang="ko"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}
html,body{margin:0;background:transparent;width:1920px;height:1080px;font-family:'Malgun Gothic',sans-serif;color:white;overflow:hidden}
.bottom{position:absolute;inset:auto 0 0;height:300px;background:linear-gradient(transparent,#050a18c9 48%,#050a18f5)}
h1{position:absolute;left:72px;bottom:108px;max-width:1776px;margin:0;font-size:80px;font-weight:900;line-height:1.18;letter-spacing:-3px;word-break:keep-all;text-wrap:balance;text-shadow:0 4px 28px #000c}
.description{position:absolute;left:76px;bottom:47px;max-width:1768px;font-size:32px;font-weight:600;line-height:1.4;letter-spacing:-.6px;word-break:keep-all;color:#e6eef8;text-shadow:0 2px 14px #000d}
.sweep{position:absolute;left:76px;bottom:96px;width:290px;height:3px;background:linear-gradient(90deg,transparent,var(--accent) 18%,#fff 64%,transparent);filter:drop-shadow(0 0 6px var(--accent))}
.line{position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent 70%)}
.battle .bottom{height:250px}
.battle h1{font-size:66px;bottom:92px}
.battle .description{bottom:37px;font-size:30px}
.battle .sweep{bottom:82px}
.without-description h1{bottom:65px}
.without-description .sweep{bottom:52px}
[data-hidden]{visibility:hidden}
</style></head><body>
<div class="bottom" data-layer="base"></div>
<h1 data-layer="title"></h1>
<div class="description" data-layer="description"></div>
<div class="sweep" data-layer="sweep"></div>
<div class="line" data-layer="base"></div>
<script type="module">
const q = new URLSearchParams(location.search)
const d = JSON.parse(q.get('data') || '{}')
document.documentElement.style.setProperty('--accent', d.accent || '#7deaff')
document.body.classList.toggle('battle', Boolean(d.battle))
document.body.classList.toggle('without-description', !d.description)
document.querySelector('h1').textContent = d.title || ''
document.querySelector('.description').textContent = d.description || ''
// The renderer reads this list before capturing the isolated transparent layers.
// Empty copy never creates a tiny blank caption or an unnecessary image input.
const layers = ['base', ...(d.title ? ['title', 'sweep'] : []), ...(d.description ? ['description'] : [])]
function setLayer(name) {
  if (name !== 'all' && !layers.includes(name)) throw new Error(`Unknown overlay layer: ${name}`)
  for (const element of document.querySelectorAll('[data-layer]')) {
    element.toggleAttribute('data-hidden', !layers.includes(element.dataset.layer) || (name !== 'all' && element.dataset.layer !== name))
  }
}
function bounds(name) {
  if (!layers.includes(name)) throw new Error(`Unknown overlay layer: ${name}`)
  if (name === 'base') return { x: 0, y: 0, width: 1920, height: 1080 }
  const box = document.querySelector(`[data-layer="${name}"]`).getBoundingClientRect()
  const padding = name === 'title' ? 30 : 14
  const x = Math.max(0, Math.floor(box.x - padding))
  const y = Math.max(0, Math.floor(box.y - padding))
  return { x, y, width: Math.min(1920, Math.ceil(box.right + padding)) - x, height: Math.min(1080, Math.ceil(box.bottom + padding)) - y }
}
window.promoOverlay = { layers, setLayer, bounds }
setLayer(q.get('layer') || 'all')
window.overlayReady = document.fonts.ready
</script></body></html>
