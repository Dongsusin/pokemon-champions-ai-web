<!doctype html><html lang="ko"><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;width:1920px;height:1080px;font-family:'Malgun Gothic',sans-serif;color:white;overflow:hidden}.top{position:absolute;inset:0 0 auto;height:185px;background:linear-gradient(#050916f5,#050916b8 55%,transparent)}.bottom{position:absolute;inset:auto 0 0;height:270px;background:linear-gradient(transparent,#050a18e8 50%,#050a18ff)}.bar{position:absolute;left:64px;top:35px;display:flex;gap:17px;align-items:center}.mark{width:9px;height:27px;background:var(--accent);box-shadow:0 0 20px color-mix(in srgb,var(--accent) 40%,transparent)}.brand{font:700 18px Arial,sans-serif;letter-spacing:3px}.counter{position:absolute;right:65px;top:36px;color:#c0d4e9;font:600 16px Arial,sans-serif;letter-spacing:3px}.eyebrow{position:absolute;left:68px;bottom:184px;font:700 19px Arial,sans-serif;letter-spacing:5px;color:var(--accent)}h1{position:absolute;left:64px;bottom:85px;margin:0;font-size:64px;letter-spacing:-3px;font-weight:900;line-height:1.3;text-shadow:0 4px 24px #000b}.description{position:absolute;left:68px;bottom:51px;font-size:25px;letter-spacing:-.4px;color:#dce6f3}.tag{position:absolute;right:64px;bottom:59px;border:1px solid #cce5ff44;border-radius:4px;padding:12px 17px;font:700 18px Arial,sans-serif;letter-spacing:2px;color:var(--accent);background:#07101dd9}.line{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--accent),#203451)}.footage{position:absolute;left:67px;top:76px;font-size:15px;letter-spacing:1px;color:#a4b6cb}.battle .bottom{height:205px}.battle .eyebrow{bottom:152px}.battle h1{font-size:51px;bottom:76px}.battle .description{bottom:38px;font-size:23px}.battle .tag{bottom:39px}.battle .top{height:110px}
.sweep{position:absolute;left:68px;bottom:171px;width:310px;height:3px;background:linear-gradient(90deg,transparent,var(--accent) 18%,white 64%,transparent);filter:drop-shadow(0 0 7px var(--accent))}.battle .sweep{bottom:141px}[data-hidden]{visibility:hidden}
</style></head><body><div class="top" data-layer="base"></div><div class="bottom" data-layer="base"></div><div class="bar" data-layer="base"><i class="mark"></i><span class="brand">CHAMPIONS ARENA</span></div><div class="counter" data-layer="base"></div><div class="footage" data-layer="base">실제 게임 화면</div><div class="eyebrow" data-layer="eyebrow"></div><h1 data-layer="title"></h1><div class="description" data-layer="description"></div><div class="tag" data-layer="tag"></div><div class="sweep" data-layer="sweep"></div><div class="line" data-layer="base"></div><script type="module">
const q = new URLSearchParams(location.search)
const d = JSON.parse(q.get('data') || '{}')
document.documentElement.style.setProperty('--accent', d.accent || '#7deaff')
document.body.classList.toggle('battle', Boolean(d.battle))
for (const [selector, key] of [['.counter', 'counter'], ['.eyebrow', 'eyebrow'], ['h1', 'title'], ['.description', 'description'], ['.tag', 'tag']]) {
  document.querySelector(selector).textContent = d[key] || ''
}
document.querySelector('.footage').textContent = d.footage || '실제 게임 화면'
const layers = ['base', 'eyebrow', 'title', 'description', 'tag', 'sweep']
function setLayer(name) {
  if (name !== 'all' && !layers.includes(name)) throw new Error(`Unknown overlay layer: ${name}`)
  for (const element of document.querySelectorAll('[data-layer]')) {
    element.toggleAttribute('data-hidden', name !== 'all' && element.dataset.layer !== name)
  }
}
function bounds(name) {
  if (name === 'base') return { x: 0, y: 0, width: 1920, height: 1080 }
  const box = document.querySelector(`[data-layer="${name}"]`).getBoundingClientRect()
  // Preserve soft text shadows while storing only the pixels needed for compositing.
  const padding = name === 'title' ? 30 : 14
  const x = Math.max(0, Math.floor(box.x - padding))
  const y = Math.max(0, Math.floor(box.y - padding))
  return { x, y, width: Math.min(1920, Math.ceil(box.right + padding)) - x, height: Math.min(1080, Math.ceil(box.bottom + padding)) - y }
}
window.promoOverlay = { layers, setLayer, bounds }
setLayer(q.get('layer') || 'all')
window.overlayReady = document.fonts.ready
</script></body></html>
