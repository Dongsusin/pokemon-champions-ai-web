<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CHAMPIONS ARENA · Gimmick Showcase</title>
    <link rel="stylesheet" href="/promo/gimmickWall.css" />
  </head>
  <body>
    <main id="gimmick-wall" class="gimmick-wall" aria-label="실제 포켓몬 배틀 기믹 모음">
      <div class="ambient" aria-hidden="true"></div>
      <header class="masthead">
        <span class="brand">POKÉMON CHAMPIONS ARENA</span>
        <span class="gimmick-label"></span>
      </header>
      <section class="wall-viewport" aria-label="아홉 가지 실제 배틀 장면">
        <div class="video-grid"></div>
        <div class="hero-caption">
          <span class="hero-kicker">ONE PARTNER. UNLIMITED POSSIBILITIES.</span>
          <strong class="hero-name"></strong>
          <span class="hero-move"></span>
        </div>
        <div class="frame-glint" aria-hidden="true"></div>
      </section>
      <div class="copy">
        <h1><span class="headline-base"></span> <em class="headline-emphasis"></em></h1>
        <p class="description"></p>
      </div>
      <span class="footage-note">실제 게임 플레이 · 다양한 포켓몬과 기술</span>
      <span class="bottom-streak" aria-hidden="true"></span>
      <p class="load-error" role="alert" hidden></p>
    </main>
    <script type="module" src="/promo/gimmickWall.js"></script>
  </body>
</html>
